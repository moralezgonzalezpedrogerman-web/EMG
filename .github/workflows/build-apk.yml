name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto (package.json o el zip subido)
        id: loc
        run: |
          buscar() { find . -maxdepth 4 -name package.json -not -path "*/node_modules/*" -not -path "*/android/*" | head -n 1; }
          P=$(buscar)
          if [ -z "$P" ]; then
            Z=$(ls -t ./*.zip 2>/dev/null | head -n 1)
            if [ -n "$Z" ]; then
              echo "No hay package.json suelto; descomprimiendo $Z"
              mkdir -p _proyecto_zip
              unzip -q -o "$Z" -d _proyecto_zip
              P=$(buscar)
            fi
          fi
          if [ -z "$P" ]; then
            echo "::error::No encontre package.json. Sube el zip completo (estudio-pro-android.zip) a la raiz del repositorio o sube el contenido de la carpeta estudio-pro (package.json, capacitor.config.json y la carpeta www)."
            ls -R . | head -60
            exit 1
          fi
          D=$(dirname "$P")
          echo "Proyecto encontrado en: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Revisar archivos del proyecto
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          test -f capacitor.config.json || { echo "::error::Falta capacitor.config.json"; exit 1; }
          test -f www/index.html || { echo "::error::Falta www/index.html (la carpeta www con la app)"; exit 1; }
          ls -la . www

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm install

      - name: Copiar MP3 (lamejs, opcional)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: cp node_modules/lamejs/lame.min.js www/lame.min.js || echo "lamejs no disponible, se omite el MP3"

      - name: Crear proyecto Android
        working-directory: ${{ steps.loc.outputs.dir }}
        run: '[ -d android ] || npx cap add android'

      - name: Permisos de microfono
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"

      - name: Sincronizar
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npx cap sync android

      - name: Compilar APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EstudioPro-APK
          path: ${{ steps.loc.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
